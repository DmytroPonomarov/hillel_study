version: '3'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development

  tests:
    build: .
    environment:
      - HOMEWORK_24_FLASK_BASE_URL=http://web:8080
    command: sh -c "sleep 3 && pytest test_search/"
    depends_on:
      - web